name: Update GitHub Trophies

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=Ashraf-AlRashidi&theme=tokyonight&column=6&margin-w=10&margin-h=10&no-frame=false&no-bg=false'
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use local trophy image in README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://github-profile-trophy.vercel.app/?username=Ashraf-AlRashidi&theme=tokyonight&column=6&margin-w=10&margin-h=10&no-frame=false&no-bg=false', './trophy.svg')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit trophy update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md trophy.svg
          git diff --cached --quiet || git commit -m 'chore: update GitHub trophies [skip ci]'
          git push